services:
  connectamente-api:
    image: connectamente-api-img
    build:
      context: .
      dockerfile: Connectamente.API/Dockerfile
    ports:
      - "5256:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: connectamente-db
    restart: always
    environment:
      MYSQL_DATABASE: connectamente_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: